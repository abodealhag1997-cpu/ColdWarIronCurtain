l_english:
 CWICR_SYR_treasury_industrial_credit:0 "Fund Syrian Industrial Credit"
 CWICR_SYR_treasury_industrial_credit_desc:0 "Allocate twelve units of the CWIC treasury reserve to capital equipment loans. For three years, modest industrial construction gains are offset by consumer-goods requirements and administrative overhead."
 CWICR_SYR_treasury_water_investment:0 "Fund Rural Water Infrastructure"
 CWICR_SYR_treasury_water_investment_desc:0 "After building an irrigation administration, commit eight treasury units to rural infrastructure for two years. This investment has real budgetary and consumer costs."
 CWICR_SYR_treasury_defence_procurement:0 "Finance Audited Defence Procurement"
 CWICR_SYR_treasury_defence_procurement_desc:0 "With a budget commission and officer training in place, allocate ten treasury units to supervised armaments infrastructure. Procurement increases industrial pressure and bureaucratic costs for two years."
 CWICR_SYR_treasury_industrial_credit_idea:0 "Industrial Development Credit"
 CWICR_SYR_treasury_industrial_credit_idea_desc:0 "A three-year programme for industrial facilities that competes for consumer resources and administrative attention."
 CWICR_SYR_treasury_water_investment_idea:0 "Budgeted Rural Water Works"
 CWICR_SYR_treasury_water_investment_idea_desc:0 "Two years of state-funded water infrastructure, with funding diverted from other economic needs."
 CWICR_SYR_treasury_defence_procurement_idea:0 "Supervised Defence Procurement"
 CWICR_SYR_treasury_defence_procurement_idea_desc:0 "Audited defence contracts improve arms-factory construction while drawing on public expenditure and political attention."

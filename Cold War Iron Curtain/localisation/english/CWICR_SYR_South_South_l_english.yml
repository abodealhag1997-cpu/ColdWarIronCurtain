 CWICR_SYR_south_south_science_invitations:0 "Invite Non-Aligned Partners to a Scientific Exchange"
 CWICR_SYR_south_south_science_invitations_desc:0 "Following the Belgrade conference, Syrian officials can propose joint academic, engineering and technical training to Yugoslavia and India. Both must accept independently, and all governments will bear an ongoing public cost."
 CWICR_SYR_SSC_joint_training_idea:0 "South-South Technical Institute"
 CWICR_SYR_SSC_joint_training_idea_desc:0 "Shared education and technical standards modestly assist research, but the programme takes resources away from consumer investment."
 CWICR_SYR_SSC.1.t:0 "Syrian Scientific Cooperation Proposal"
 CWICR_SYR_SSC.1.d:0 "Damascus invites Yugoslav institutes into a non-aligned technical training programme. Participating may extend Yugoslavia's reach into the Levant, but it requires administrative funding and makes no promise of future treaties."
 CWICR_SYR_SSC.1.a:0 "Accept a technical exchange."
 CWICR_SYR_SSC.1.b:0 "Decline the Syrian invitation."
 CWICR_SYR_SSC.2.t:0 "Damascus Invites India to a Scientific Exchange"
 CWICR_SYR_SSC.2.d:0 "The Syrian government has requested a modest exchange of scientific and engineering expertise. It seeks an alternative to exclusive reliance on either Cold War bloc. India retains full discretion over participation."
 CWICR_SYR_SSC.2.a:0 "Support reciprocal training."
 CWICR_SYR_SSC.2.b:0 "We cannot commit resources."
 CWICR_SYR_SSC.3.t:0 "Result of the Syrian Scientific Initiative"
 CWICR_SYR_SSC.3.d:0 "Our outreach to Yugoslavia and India has concluded. If both countries accepted, shared research programmes will require funding and organisation. If a partner declined, the proposal has failed and the government must account for its political expenditure."
 CWICR_SYR_SSC.3.a:0 "Review the diplomatic replies."
 CWICR_SYR_SSC.4.t:0 "Syria, India and Yugoslavia Announce Technical Cooperation"
 CWICR_SYR_SSC.4.d:0 "After Syrian diplomatic overtures, the three governments have reached a limited arrangement on technical training and scientific exchange. All three will fund the institutions from their own budgets. No military alliance has been formed."
 CWICR_SYR_SSC.4.a:0 "A modest new partnership."

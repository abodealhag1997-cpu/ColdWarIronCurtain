l_english:
 CWICR_SYR_city_construction_category:0 "Syrian City Investment Projects"
 CWICR_SYR_security_directorate_category:0 "Syrian Strategic Intelligence"
 CWICR_SYR_private_contractors_category:0 "Syrian Military Contractors"
 CWICR_SYR_URB_damascus_administration:0 "Damascus Public Administration Campus"
 CWICR_SYR_URB_damascus_administration_desc:0 "Expand administrative offices and training capacity in Damascus after securing funding and a skilled workforce."
 CWICR_SYR_URB_aleppo_industrial_estate:0 "Aleppo Industrial Estate"
 CWICR_SYR_URB_aleppo_industrial_estate_desc:0 "Develop an industrial estate in Aleppo after completing Syria's industrial research pathway."
 CWICR_SYR_URB_homs_defence_workshops:0 "Homs Defence Workshops"
 CWICR_SYR_URB_homs_defence_workshops_desc:0 "Create a tightly budgeted arms-production facility in Homs, subject to technology and local security."
 CWICR_SYR_URB_hama_agro_processing:0 "Hama Agricultural Processing Complex"
 CWICR_SYR_URB_hama_agro_processing_desc:0 "Develop agro-industrial processing for the Orontes valley, after investment in irrigation methods."
 CWICR_SYR_URB_latakia_port_modernisation:0 "Latakia Shipbuilding Expansion"
 CWICR_SYR_URB_latakia_port_modernisation_desc:0 "Extend the shipbuilding base at Latakia, using a finite civilian investment budget."
 CWICR_SYR_URB_deir_waterworks:0 "Deir ez-Zor Waterworks"
 CWICR_SYR_URB_deir_waterworks_desc:0 "Expand water infrastructure along the Euphrates after applied hydroengineering research."
 CWICR_SYR_URB_hasakah_rural_cooperatives:0 "Hasakah Agricultural Cooperatives"
 CWICR_SYR_URB_hasakah_rural_cooperatives_desc:0 "Create a second agro-industrial processing centre for Syria's northeast."
 CWICR_SYR_URB_rif_dimashq_signal_station:0 "Rif Dimashq Signals Station"
 CWICR_SYR_URB_rif_dimashq_signal_station_desc:0 "Construct a radar installation near Damascus after specialised air-defence network research."
 CWICR_SYR_INT_build_central_directorate:0 "Establish a Central Intelligence Directorate"
 CWICR_SYR_INT_build_central_directorate_desc:0 "Fund a professional intelligence headquarters with oversight, personnel and operational costs."
 CWICR_SYR_INT_expand_foreign_stations:0 "Expand Overseas Intelligence Stations"
 CWICR_SYR_INT_expand_foreign_stations_desc:0 "Create a larger overseas intelligence network. The United States and Soviet Union respond independently."
 CWICR_SYR_INT_satellite_analysis_network:0 "Build an Advanced Intelligence Analysis Centre"
 CWICR_SYR_INT_satellite_analysis_network_desc:0 "Link intelligence assessment to satellite reception and earth-observation research at a very high financial cost."
 CWICR_SYR_PMC_regulation:0 "Regulate Syrian Private Military Contractors"
 CWICR_SYR_PMC_regulation_desc:0 "Create a legal framework and audit structure for contract security organisations; this does not create free divisions."
 CWICR_SYR_PMC_lebanese_security_contract:0 "Offer Lebanese Security Training"
 CWICR_SYR_PMC_lebanese_security_contract_desc:0 "Propose a time-limited security advisory contract. Lebanon can refuse."
 CWICR_SYR_PMC_iraqi_training_contract:0 "Offer Iraqi Military Training"
 CWICR_SYR_PMC_iraqi_training_contract_desc:0 "Offer a limited training-services contract. Iraq decides whether to accept."
 CWICR_SYR_INT_directorate_idea:0 "Syrian Central Intelligence Directorate"
 CWICR_SYR_INT_directorate_idea_desc:0 "The new agency hires operatives and coordinates intelligence, while consuming industrial and political resources."
 CWICR_SYR_INT_regional_network_idea:0 "Syrian Overseas Intelligence Network"
 CWICR_SYR_INT_regional_network_idea_desc:0 "A far-reaching but costly external intelligence service operates under regional and international scrutiny."
 CWICR_SYR_INT_advanced_analysis_idea:0 "Syrian Strategic Intelligence Analysis Centre"
 CWICR_SYR_INT_advanced_analysis_idea_desc:0 "Advanced intelligence analysis builds on decades of research. Substantial administrative and equipment costs persist."
 CWICR_SYR_PMC_regulated_idea:0 "Licensed Syrian Security Contractors"
 CWICR_SYR_PMC_regulated_idea_desc:0 "Privately contracted security trainers operate under state licensing and budgetary oversight."
 CWICR_SYR_PMC_host_advisers_idea:0 "Syrian Contract Security Advisers"
 CWICR_SYR_PMC_host_advisers_idea_desc:0 "Consent-based foreign military advisory teams provide temporary training and logistical support."
 CWICR_SYR_PMC_export_office_idea:0 "Overseas Security Contract Office"
 CWICR_SYR_PMC_export_office_idea_desc:0 "Temporary export revenue and political costs accompany a foreign security contract."
 CWICR_SYR_SEC_intelligence_concern:0 "Concerns Over Syrian Intelligence"
 CWICR_SYR_SEC_security_dialogue:0 "Bilateral Security Dialogue"
 CWICR_SYR_SEC_host_contract:0 "Security Training Agreement"
 CWICR_SYR_SEC_contract_refused:0 "Rejected Security Contract"
 CWICR_SYR_SEC.1.t:0 "Washington Responds to Syrian Intelligence Growth"
 CWICR_SYR_SEC.1.d:0 "Syria has announced major investments in its foreign-intelligence institutions. Washington must decide whether to voice concerns or open a cautious dialogue."
 CWICR_SYR_SEC.1.a:0 "Raise concerns over the programme"
 CWICR_SYR_SEC.1.b:0 "Pursue a security dialogue"
 CWICR_SYR_SEC.2.t:0 "Moscow Reviews Syrian Intelligence Expansion"
 CWICR_SYR_SEC.2.d:0 "The Soviet government evaluates Syria's expanding intelligence network and its impact on regional relationships."
 CWICR_SYR_SEC.2.a:0 "Offer guarded diplomatic engagement"
 CWICR_SYR_SEC.2.b:0 "Voice strategic concerns"
 CWICR_SYR_SEC.3.t:0 "Syria Expands Its Intelligence Institutions"
 CWICR_SYR_SEC.3.d:0 "Syria has announced a costly expansion of its external intelligence network. The great powers weigh the implications for their regional interests."
 CWICR_SYR_SEC.3.a:0 "A new regional security calculation"
 CWICR_SYR_SEC.4.t:0 "Syria Proposes Security Contractors for Lebanon"
 CWICR_SYR_SEC.4.d:0 "Damascus proposes a two-year contract for Syrian training and administrative security advisers. Lebanon retains the right to refuse."
 CWICR_SYR_SEC.4.a:0 "Accept limited training under Lebanese authority"
 CWICR_SYR_SEC.4.b:0 "Decline the foreign security contract"
 CWICR_SYR_SEC.5.t:0 "Syrian Security Contract Offered to Iraq"
 CWICR_SYR_SEC.5.d:0 "The Syrian government proposes a time-limited training arrangement. Iraq may accept the civilian-military costs or reject the proposal."
 CWICR_SYR_SEC.5.a:0 "Accept the advisory mission"
 CWICR_SYR_SEC.5.b:0 "Decline the Syrian contract"
 CWICR_SYR_PMC_recruit_home_brigade:0 "Recruit a Syrian Contract Security Brigade"
 CWICR_SYR_PMC_recruit_home_brigade_desc:0 "Pay for one small Syrian contractor formation. It must draw equipment from normal national stocks and deploys with only partial manpower; no foreign unit or free weapon stockpile is created."

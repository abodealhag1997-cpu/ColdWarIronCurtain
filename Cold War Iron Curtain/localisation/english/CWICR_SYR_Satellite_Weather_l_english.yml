l_english:
 CWICR_SYR_satellite_weather_network:0 "Invite Neighbours to a Satellite Weather Network"
 CWICR_SYR_satellite_weather_network_desc:0 "Use Syria's newly researched satellite meteorological reception capability to invite Iraq, Jordan and Lebanon to share weather observations and drought warnings. Each government may independently accept or refuse."
 CWICR_SYR_satellite_weather_cooperation_idea:0 "Regional Weather Data Exchange"
 CWICR_SYR_satellite_weather_cooperation_idea_desc:0 "A modest scientific exchange improves access to useful data, while local offices and specialist staff require public resources."
 CWICR_SYR_SAT.1.t:0 "Syria Offers Satellite Weather Data Cooperation"
 CWICR_SYR_SAT.1.d:0 "Damascus has proposed exchanging satellite-assisted weather analyses with Iraq, including drought observations and flood warnings. The arrangement entails limited technical spending but does not concede control over river water."
 CWICR_SYR_SAT.1.a:0 "Accept a technical cooperation programme"
 CWICR_SYR_SAT.1.b:0 "Keep national forecasting independent"
 CWICR_SYR_SAT.2.t:0 "Damascus Proposes a Regional Weather Network"
 CWICR_SYR_SAT.2.d:0 "Syria has invited Jordan to join a shared network of weather observations using externally supplied satellite data. Membership would be voluntary and requires local operational spending."
 CWICR_SYR_SAT.2.a:0 "Accept and coordinate forecasts"
 CWICR_SYR_SAT.2.b:0 "Decline the invitation"
 CWICR_SYR_SAT.3.t:0 "Syria Invites Lebanon to Share Satellite Weather Analyses"
 CWICR_SYR_SAT.3.d:0 "Damascus proposes a civilian exchange of meteorological information with Lebanon. The initiative promises incremental scientific benefits but no guaranteed economic returns."
 CWICR_SYR_SAT.3.a:0 "Support the technical network"
 CWICR_SYR_SAT.3.b:0 "Do not participate"
 CWICR_SYR_SAT.4.t:0 "Syria Proposes Regional Satellite Weather Cooperation"
 CWICR_SYR_SAT.4.d:0 "The Syrian government has invited Iraq, Jordan and Lebanon to consider sharing satellite-derived weather observations and drought warnings. Each capital will determine its own response; no agreement has yet been signed."
 CWICR_SYR_SAT.4.a:0 "The neighbouring governments will decide"

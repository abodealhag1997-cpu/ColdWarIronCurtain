l_english:
 CWICR_SYR_regional_initiatives_category:0 "Syrian Regional and Global Initiatives"
 CWICR_SYR_regional_initiatives_category_desc:0 "Initiatives launched by Syria, with independent diplomatic responses from foreign governments."
 CWICR_SYR_levante_trade_corridor:0 "Propose a Levantine Transit Corridor"
 CWICR_SYR_levante_trade_corridor_desc:0 "Invite Lebanon to negotiate customs and infrastructure coordination. Syria invests political capital, but Lebanon may decline."
 CWICR_SYR_euphrates_water_dialogue:0 "Convene Euphrates Water Talks"
 CWICR_SYR_euphrates_water_dialogue_desc:0 "Seek an Iraq-Syria water administration commission. Shared planning can help both sides; rejection will sharpen mistrust. This is not an automatic water-rights settlement."
 CWICR_SYR_jordan_border_commission:0 "Offer Jordan a Border Commission"
 CWICR_SYR_jordan_border_commission_desc:0 "Propose practical border security and liaison talks. Jordan retains full discretion over participation."
 CWICR_SYR_egypt_technical_exchange:0 "Offer an Egyptian Technical Exchange"
 CWICR_SYR_egypt_technical_exchange_desc:0 "Offer reciprocal communications-engineering research cooperation. Both states must invest resources and Egypt can refuse."
 CWICR_SYR_two_bloc_non_alignment_dialogue:0 "Open Talks with Both Superpowers"
 CWICR_SYR_two_bloc_non_alignment_dialogue_desc:0 "Attempt balanced diplomatic contact with Washington and Moscow. Each government responds independently and the opposing bloc may grow suspicious."
 CWICR_SYR_transit_agreement_idea:0 "Levantine Transit Coordination"
 CWICR_SYR_transit_agreement_idea_desc:0 "Joint transit administration modestly assists infrastructure work while raising public expenditure."
 CWICR_SYR_water_commission_idea:0 "Euphrates Technical Commission"
 CWICR_SYR_water_commission_idea_desc:0 "Regular water and infrastructure talks require personnel and public expenditure; they do not automatically transfer water or territory."
 CWICR_SYR_transit_partners:0 "Levantine Transit Cooperation"
 CWICR_SYR_diplomatic_refusal:0 "Refused Syrian Initiative"
 CWICR_SYR_water_partners:0 "Euphrates Technical Cooperation"
 CWICR_SYR_water_dispute:0 "Disagreement over Euphrates Water"
 CWICR_SYR_border_partners:0 "Border Liaison Cooperation"
 CWICR_SYR_science_partners:0 "Technical Research Exchange"
 CWICR_SYR_balanced_outreach:0 "Diplomatic Opening with Syria"
 CWICR_SYR_bloc_suspicion:0 "Suspicion of Syrian Bloc Contacts"
 CWICR_SYR_REG.1.t:0 "A Syrian Proposal for Levantine Transit"
 CWICR_SYR_REG.1.d:0 "Damascus proposes a limited customs and infrastructure arrangement with Lebanon. A cooperative programme could ease transport bottlenecks, but would also require Lebanese funding and administration."
 CWICR_SYR_REG.1.a:0 "Negotiate a transit arrangement."
 CWICR_SYR_REG.1.b:0 "Decline the proposal."
 CWICR_SYR_REG.2.t:0 "Damascus Invites Us to Euphrates Talks"
 CWICR_SYR_REG.2.d:0 "Syria seeks a bilateral commission to exchange technical data and discuss Euphrates water management. No binding water allocation is on offer, but the political consequences of acceptance or rejection may outlast the negotiations."
 CWICR_SYR_REG.2.a:0 "Establish a technical commission."
 CWICR_SYR_REG.2.b:0 "Reject the initiative."
 CWICR_SYR_REG.3.t:0 "Syrian-Jordanian Border Consultation"
 CWICR_SYR_REG.3.d:0 "Syrian representatives propose regular liaison meetings with Jordan to prevent border incidents. Officials warn that cooperation will require political attention and reciprocal confidence."
 CWICR_SYR_REG.3.a:0 "Establish a liaison channel."
 CWICR_SYR_REG.3.b:0 "Keep our distance."
 CWICR_SYR_REG.4.t:0 "A Syrian-Egyptian Technical Exchange"
 CWICR_SYR_REG.4.d:0 "Syria proposes a modest exchange of communications expertise and research practices. Participation would give both governments a limited technical research benefit without granting finished equipment or major industrial capacity."
 CWICR_SYR_REG.4.a:0 "Exchange technical expertise."
 CWICR_SYR_REG.4.b:0 "Refuse the exchange."
 CWICR_SYR_REG.5.t:0 "Damascus Requests Talks with Washington"
 CWICR_SYR_REG.5.d:0 "Syria has requested consultations with both the United States and the Soviet Union. Washington must decide whether contact is worth the risk of signalling tolerance for a Syrian non-aligned policy."
 CWICR_SYR_REG.5.a:0 "Keep a diplomatic channel open."
 CWICR_SYR_REG.5.b:0 "Decline the invitation."
 CWICR_SYR_REG.6.t:0 "Damascus Requests Talks with Moscow"
 CWICR_SYR_REG.6.d:0 "Syria has offered consultations with both Cold War blocs. Moscow may engage, though engagement could trigger suspicion in the West and create uncertainty over Damascus's longer-term orientation."
 CWICR_SYR_REG.6.a:0 "Open consultations with Damascus."
 CWICR_SYR_REG.6.b:0 "Reject the proposal."
 CWICR_SYR_REG.7.t:0 "Syria Announces a Two-Bloc Diplomatic Initiative"
 CWICR_SYR_REG.7.d:0 "Damascus has publicly requested separate consultations with Washington and Moscow, presenting the initiative as an effort to preserve room for manoeuvre between competing powers. Neither government has committed to an agreement."
 CWICR_SYR_REG.7.a:0 "The world awaits their replies."

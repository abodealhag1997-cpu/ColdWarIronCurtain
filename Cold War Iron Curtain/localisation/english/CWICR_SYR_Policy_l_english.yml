l_english:
 CWICR_SYR_institutions_category:0 "Civilian and Military Institutions"
 CWICR_SYR_institutions_category_desc:0 "The Syrian state's contested balance between elected institutions, the army and constitutional safeguards."
 CWICR_SYR_economic_paths_category:0 "Syrian Development Model"
 CWICR_SYR_economic_paths_category_desc:0 "Debate over taxation, state enterprises, rural credit, investment priorities and the administrative price of reforms."
 CWICR_SYR_diplomacy_category:0 "Regional Diplomacy and International Mediation"
 CWICR_SYR_diplomacy_category_desc:0 "Arab consultations, United Nations representations and support for displaced communities."
 CWICR_SYR_strategic_programme_category:0 "Long-Term Strategic Research"
 CWICR_SYR_strategic_programme_category_desc:0 "Expensive research choices involving international safeguards, diplomatic risk and domestic opportunity costs."
 CWICR_SYR_constitutional_bargain:0 "Convene an Institutional Settlement"
 CWICR_SYR_constitutional_bargain_desc:0 "The parliament, army and presidency must define the limits of each institution. The compromise will shape stability and military cohesion."
 CWICR_SYR_development_model:0 "Adopt a National Development Framework"
 CWICR_SYR_development_model_desc:0 "After establishing budget oversight, choose whether to prioritise public investment, regulated enterprise or rural credit. Each has costs."
 CWICR_SYR_anti_corruption_audit:0 "Conduct an Annual Procurement Audit"
 CWICR_SYR_anti_corruption_audit_desc:0 "Inspect public procurement and ministry accounts. This expensive investigation can modestly improve confidence once a year."
 CWICR_SYR_arab_consultations:0 "Hold Regional Arab Consultations"
 CWICR_SYR_arab_consultations_desc:0 "Convene talks with Egypt, Iraq and Jordan on economic cooperation and regional stability. Trust-building costs political capital."
 CWICR_SYR_un_mediation_dossier:0 "Prepare a UN Mediation Dossier"
 CWICR_SYR_un_mediation_dossier_desc:0 "Prepare records, diplomatic briefs and de-escalation proposals. This registers outreach and dialogue, not a guaranteed UN vote or agreement."
 CWICR_SYR_displaced_families_services:0 "Coordinate Services for Displaced Families"
 CWICR_SYR_displaced_families_services_desc:0 "Provide a durable administrative response to displaced families. Greater social cohesion is balanced by public expenditure."
 CWICR_SYR_nuclear_feasibility:0 "Commission a Nuclear Feasibility Review"
 CWICR_SYR_nuclear_feasibility_desc:0 "Requires atomic research and considerable political capital. No reactor, fissile material, warhead or delivery system is awarded."
 CWICR_SYR_civilian_compact_idea:0 "Constitutional Civilian Compact"
 CWICR_SYR_civilian_compact_idea_desc:0 "Parliamentary safeguards strengthen civilian administration but slow military patronage networks and increase administrative costs."
 CWICR_SYR_army_guardianship_idea:0 "Army Guardianship of State Institutions"
 CWICR_SYR_army_guardianship_idea_desc:0 "A stronger military voice may help operational readiness while weakening civilian confidence and cabinet autonomy."
 CWICR_SYR_public_development_idea:0 "State-Led Development Investment"
 CWICR_SYR_public_development_idea_desc:0 "Public industrial investment comes at the cost of civilian consumption and administrative attention."
 CWICR_SYR_regulated_enterprise_idea:0 "Regulated Private Enterprise"
 CWICR_SYR_regulated_enterprise_idea_desc:0 "Supervised commercial investment helps the treasury, but unequal growth can aggravate social tensions."
 CWICR_SYR_rural_credit_idea:0 "Rural Cooperative Credit"
 CWICR_SYR_rural_credit_idea_desc:0 "Credit for agricultural infrastructure diverts resources from research and urban industry."
 CWICR_SYR_displaced_families_idea:0 "Displacement Support Administration"
 CWICR_SYR_displaced_families_idea_desc:0 "Public coordination for displaced communities boosts cohesion but requires continued revenue and staffing."
 CWICR_SYR_nuclear_safeguards_idea:0 "Safeguarded Nuclear Feasibility Study"
 CWICR_SYR_nuclear_safeguards_idea_desc:0 "A civilian nuclear feasibility study under international safeguards burdens research budgets and public finances."
 CWICR_SYR_nuclear_opaque_idea:0 "Opaque Strategic Nuclear Review"
 CWICR_SYR_nuclear_opaque_idea_desc:0 "An untransparent research commission strains diplomacy, administrative capacity and domestic confidence without granting weapons."
 CWICR_SYR_regional_consultation:0 "Arab Policy Consultations"
 CWICR_SYR_un_dialogue:0 "Participation in International Mediation"
 CWICR_SYR_open_safeguards:0 "Internationally Safeguarded Research"
 CWICR_SYR_opaque_programme:0 "Concerns about Research Transparency"
 CWICR_SYR.1.t:0 "Syria's Constitutional Balance"
 CWICR_SYR.1.d:0 "Repeated changes of government have raised fundamental questions about the authority of parliament and the armed forces. A compact may provide restraint, but competing institutions will defend their interests."
 CWICR_SYR.1.a:0 "Strengthen Civilian Constitutional Safeguards"
 CWICR_SYR.1.b:0 "Recognise the Army's Political Guardianship"
 CWICR_SYR.2.t:0 "The National Development Debate"
 CWICR_SYR.2.d:0 "Limited revenues cannot finance every ambition. Ministers propose state industry, supervised enterprise and support for rural credit, with opposing consequences for cohesion and growth."
 CWICR_SYR.2.a:0 "Concentrate Resources in Public Industry"
 CWICR_SYR.2.b:0 "Encourage Regulated Private Enterprise"
 CWICR_SYR.2.c:0 "Prioritise Rural Credit and Irrigation"
 CWICR_SYR.3.t:0 "The Nuclear Research Question"
 CWICR_SYR.3.d:0 "Scientists and ministers propose a preliminary feasibility review. International safeguards may improve trust, while opacity would provoke suspicion. Neither option grants the industrial capacity to construct a nuclear weapon."
 CWICR_SYR.3.a:0 "Accept International Safeguards"
 CWICR_SYR.3.b:0 "Keep the Review under Restricted Oversight"
